<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --border:#dfe3e8;
    --ink:#1c2430; --ink-2:#5a6675; --accent:#3b5bdb; --accent-ink:#2a44a8;
    --ok:#2f9e44; --warn:#e0a94a; --crit:#e03131;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans','IBM Plex Sans JP',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1319; --surface:#171d26; --surface-2:#1e2530; --border:#2b333f;
      --ink:#e7ecf2; --ink-2:#9aa6b4; --accent:#7c93f0; --accent-ink:#a9baf7;
      --ok:#51cf66; --warn:#ffd43b; --crit:#ff6b6b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header.top{display:flex;align-items:baseline;gap:14px;padding:18px 28px;
       border-bottom:1px solid var(--border);background:var(--surface)}
  header.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
  header.top .crumb{color:var(--ink-2);font-size:13px}
  main{max-width:1120px;margin:0 auto;padding:26px 28px 60px}
  h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
     color:var(--ink-2);margin:30px 0 12px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
  .card h3{margin:0 0 4px;font-size:14px;font-weight:600}
  .card .sub{color:var(--ink-2);font-size:12px;font-family:var(--mono);word-break:break-all}
  .stat-row{display:flex;gap:22px;margin-top:12px}
  .stat{display:flex;flex-direction:column}
  .stat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);
        vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
        font-weight:500;border:1px solid var(--border)}
  .pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
  .pill.muted{color:var(--ink-2)}
  .meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--accent)}
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .empty{color:var(--ink-2);font-size:13px;padding:14px 4px}
  code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header class="top">
  <h1><a href="/">{{ app_name }}</a></h1>
  <span class="crumb">{% block crumb %}{% endblock %}</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
