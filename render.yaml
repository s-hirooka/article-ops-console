# Render blueprint — free tier.
# Postgres is NOT provisioned here: Render's free Postgres expires after 30 days.
# Use an external Neon free database and set DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: article-ops-console
    runtime: python
    plan: free
    # Migrations are run from a workstation with the owner connection string
    # (the runtime DATABASE_URL below is the non-privileged app_user, which has
    # no DDL rights). See DEPLOY.md.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"          # google-ads/pillow/psycopg all ship 3.12 wheels
      - key: DATABASE_URL
        sync: false              # set to the Neon connection string (dashboard)
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false              # 手順6でWebクライアント作成後に設定
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_OAUTH2_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_OAUTH2_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_OAUTH2_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_DEFAULT_CUSTOMER_ID
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false              # https://<service>.onrender.com/oauth/google/callback
      - key: DEV_ACCOUNT_ID
        value: "1"
      - key: CRON_TOKEN
        sync: false              # GitHub Actions (.github/workflows/rank_sync.yml) の共有シークレット
      # --- Amazon Creators API（旧PA-API後継）— 記事内の商品トークンを実在商品に自動置換 ---
      - key: AMAZON_CREDENTIAL_ID
        sync: false              # Associates Central → Creators API（amzn1.application-oa2-client.…）
      - key: AMAZON_CREDENTIAL_SECRET
        sync: false              # 同上（amzn1.oa2-cs.v1.…）
      - key: AMAZON_PARTNER_TAG
        sync: false              # トラッキングID（例: swork_seo-22）
      - key: AMAZON_API_VERSION
        value: "3.3"              # Creators API コンソール表示のバージョン（Far East/JP = 3.3）
      - key: AMAZON_COUNTRY
        value: "JP"

  # --- P5: Next.js frontend, static export, free Static Site (no sleep) ---
  - type: web
    name: article-ops-console-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://article-ops-console.onrender.com   # ← 実際のバックエンド URL に合わせる
    # 静的書き出し（trailingSlash: true）なので各ルートに index.html が出力される。
    # 未知パスは Next 生成の out/404.html が使われる。rewrite ルールは不要。
